<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Graph</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0f; color: #e0e0e0; font-family: 'SF Mono', 'Fira Code', monospace; overflow: hidden; }
#header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(10,10,15,0.92); backdrop-filter: blur(8px); padding: 12px 24px; display: flex; align-items: center; gap: 20px; border-bottom: 1px solid #222; }
#header h1 { font-size: 14px; font-weight: 600; color: #999; letter-spacing: 1px; text-transform: uppercase; }
#header .stats { font-size: 12px; color: #555; }
#controls { position: fixed; top: 50px; left: 20px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
.ctrl-btn { background: rgba(30,30,40,0.9); border: 1px solid #333; color: #888; padding: 6px 12px; font-size: 11px; cursor: pointer; border-radius: 4px; font-family: inherit; transition: all 0.2s; }
.ctrl-btn:hover { border-color: #666; color: #ccc; }
.ctrl-btn.active { border-color: #e8a735; color: #e8a735; }
#legend { position: fixed; bottom: 20px; left: 20px; z-index: 100; background: rgba(10,10,15,0.9); border: 1px solid #222; border-radius: 6px; padding: 12px 16px; font-size: 11px; max-height: calc(100vh - 80px); overflow-y: auto; }
#legend .legend-title { font-size: 10px; font-weight: 600; color: #666; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
#legend .legend-title span { cursor: pointer; color: #555; font-size: 9px; text-transform: none; letter-spacing: 0; }
#legend .legend-title span:hover { color: #e8a735; }
#legend .item { display: flex; align-items: center; gap: 8px; margin: 4px 0; cursor: pointer; user-select: none; transition: opacity 0.2s; }
#legend .item:hover { opacity: 1 !important; }
#legend .item.off { opacity: 0.3; }
#legend .item.off .dot { background: #333 !important; }
#legend .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; transition: background 0.2s; }
#detail { position: fixed; top: 50px; right: 20px; z-index: 100; background: rgba(10,10,15,0.95); border: 1px solid #333; border-radius: 6px; padding: 16px 20px; max-width: 340px; font-size: 12px; display: none; line-height: 1.6; }
#detail h3 { color: #e8a735; font-size: 13px; margin-bottom: 8px; padding-right: 20px; }
#detail .close-btn { position: absolute; top: 12px; right: 14px; cursor: pointer; color: #555; font-size: 16px; line-height: 1; transition: color 0.2s; }
#detail .close-btn:hover { color: #e8a735; }
#detail .type-badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 10px; margin-bottom: 8px; }
#detail .connections { margin-top: 10px; color: #888; }
#detail .conn-item { color: #aaa; margin: 3px 0; cursor: pointer; }
#detail .conn-item:hover { color: #e8a735; }
#search { position: fixed; top: 50px; right: 20px; z-index: 101; display: none; }
#search input { background: rgba(10,10,15,0.95); border: 1px solid #444; color: #e0e0e0; padding: 8px 14px; font-size: 12px; font-family: inherit; border-radius: 4px; width: 280px; outline: none; }
#search input:focus { border-color: #e8a735; }
#empty-state { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #444; font-size: 14px; display: none; }
#empty-state h2 { color: #555; font-size: 16px; margin-bottom: 12px; font-weight: 600; }
svg { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="header">
  <h1>Knowledge Graph</h1>
  <span class="stats" id="stats"></span>
</div>
<div id="controls">
  <button class="ctrl-btn" onclick="resetView()">Reset View</button>
  <button class="ctrl-btn" onclick="toggleLabels()">Edge Labels</button>
  <button class="ctrl-btn" onclick="toggleSearch()">Search</button>
  <button class="ctrl-btn" onclick="toggleSources()">Toggle Sources</button>
  <button class="ctrl-btn" onclick="filterPredictions()">Predictions</button>
  <button class="ctrl-btn" onclick="groupByDomain()">Cluster</button>
</div>
<div id="legend">
  <div class="legend-title">Domains <span id="legend-toggle-all" onclick="toggleAllDomains()">deselect all</span></div>
  <div class="item"><div class="dot" style="background:#e8a735"></div> Domain</div>
  <!-- Domain legend items are auto-generated by brain.py export-graph -->
</div>
<div id="detail">
  <span class="close-btn" onclick="closeDetail()">&times;</span>
  <h3 id="detail-title"></h3>
  <div class="type-badge" id="detail-type"></div>
  <div id="detail-info"></div>
  <div class="connections" id="detail-connections"></div>
</div>
<div id="search">
  <input type="text" id="search-input" placeholder="Search nodes..." oninput="searchNodes(this.value)">
</div>
<div id="empty-state">
  <h2>Your knowledge graph is empty</h2>
  <p>Ingest material into your brain to see it visualised here.</p>
</div>
<svg id="graph"></svg>

<script>
// ── Graph Data (auto-populated by brain.py export-graph) ──
const graphData = {
  "meta": {
    "title": "Knowledge Graph",
    "updated": "not yet",
    "version": "2.0",
    "nodeCount": 0,
    "edgeCount": 0
  },
  "nodes": [],
  "edges": []
};

// ── Configuration ──
const groupColors = {
  1: '#4ecdc4', 2: '#ff6b6b', 3: '#a66cff', 4: '#45b7d1',
  5: '#f7dc6f', 6: '#e74c3c', 7: '#2ecc71', 8: '#7f8c8d',
  9: '#d35400', 10: '#1abc9c', 11: '#e67e22', 12: '#3498db',
  13: '#9b59b6'
};

function getColor(d) {
  if (d.type === 'domain') return '#e8a735';
  if (d.type === 'source') return '#95a5a6';
  return groupColors[d.group] || '#666';
}
function colorDarker(hex, amt) {
  let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  r = Math.max(0, Math.round(r * (1 - amt))); g = Math.max(0, Math.round(g * (1 - amt))); b = Math.max(0, Math.round(b * (1 - amt)));
  return '#' + [r,g,b].map(c => c.toString(16).padStart(2,'0')).join('');
}
function getRadius(d) {
  if (d.type === 'domain') return 14;
  if (d.type === 'prediction') return 10;
  if (d.type === 'source') return 6;
  return 8;
}

// ── State ──
let showSources = false;
let showEdgeLabels = false;
let clustered = false;
let selectedNode = null;
let dragTarget = null;
let dragOffsetX = 0, dragOffsetY = 0;
let transform = { x: 0, y: 0, k: 1 };
let isPanning = false, panStartX = 0, panStartY = 0, panStartTX = 0, panStartTY = 0;
let animating = false;
let alpha = 1;
const alphaMin = 0.001;
const alphaDecay = 0.0228;
const velocityDecay = 0.4;

// Domain visibility
const allGroupIds = new Set(graphData.nodes.map(n => n.group).filter(g => g != null));
const visibleGroups = new Set(allGroupIds);

// Node map for quick lookup
const nodeMap = {};
graphData.nodes.forEach(n => { nodeMap[n.id] = n; });

// ── SVG Setup ──
const svg = document.getElementById('graph');
const ns = 'http://www.w3.org/2000/svg';
const gRoot = document.createElementNS(ns, 'g');
svg.appendChild(gRoot);
const gLinks = document.createElementNS(ns, 'g');
gLinks.setAttribute('class', 'links');
gRoot.appendChild(gLinks);
const gLabels = document.createElementNS(ns, 'g');
gLabels.setAttribute('class', 'edge-labels');
gRoot.appendChild(gLabels);
const gNodes = document.createElementNS(ns, 'g');
gNodes.setAttribute('class', 'nodes');
gRoot.appendChild(gNodes);

// ── Force Simulation (vanilla JS) ──
function initPositions() {
  const w = window.innerWidth, h = window.innerHeight;
  graphData.nodes.forEach(n => {
    if (n.x == null) { n.x = w/2 + (Math.random() - 0.5) * w * 0.6; }
    if (n.y == null) { n.y = h/2 + (Math.random() - 0.5) * h * 0.6; }
    if (n.vx == null) n.vx = 0;
    if (n.vy == null) n.vy = 0;
  });
}

function getLinkDistance(edge) {
  const spread = showEdgeLabels ? 1.8 : 1;
  if (edge.type === 'contains') return 60 * spread;
  if (edge.type === 'sources') return 80 * spread;
  return 100 * spread;
}

function getChargeStrength(node) {
  const spread = showEdgeLabels ? 1.8 : 1;
  if (node.type === 'domain') return -400 * spread;
  if (node.type === 'source') return -60 * spread;
  return -120 * spread;
}

function getCollisionRadius(node) {
  return getRadius(node) + (showEdgeLabels ? 16 : 4);
}

function tickForces(nodes, edges) {
  const n = nodes.length;
  if (n === 0) return;

  const w = window.innerWidth, h = window.innerHeight;
  const cx = w / 2, cy = h / 2;

  // Charge repulsion (O(n²), fine for < 1000 nodes)
  for (let i = 0; i < n; i++) {
    const a = nodes[i];
    for (let j = i + 1; j < n; j++) {
      const b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let dist = Math.sqrt(dx * dx + dy * dy) || 1;
      const strengthA = getChargeStrength(a);
      const strengthB = getChargeStrength(b);
      const strength = (strengthA + strengthB) / 2;
      const force = strength / (dist * dist);
      const fx = (dx / dist) * force * alpha;
      const fy = (dy / dist) * force * alpha;
      a.vx -= fx; a.vy -= fy;
      b.vx += fx; b.vy += fy;
    }
  }

  // Link spring forces
  const nodeIndex = {};
  nodes.forEach(nd => { nodeIndex[nd.id] = nd; });

  edges.forEach(e => {
    const s = nodeIndex[e._sid] || nodeIndex[e._sid];
    const t = nodeIndex[e._tid] || nodeIndex[e._tid];
    if (!s || !t) return;
    let dx = t.x - s.x, dy = t.y - s.y;
    let dist = Math.sqrt(dx * dx + dy * dy) || 1;
    const target = getLinkDistance(e);
    const force = (dist - target) / dist * 0.3 * alpha;
    const fx = dx * force, fy = dy * force;
    s.vx += fx; s.vy += fy;
    t.vx -= fx; t.vy -= fy;
  });

  // Center gravity
  nodes.forEach(nd => {
    nd.vx += (cx - nd.x) * 0.01 * alpha;
    nd.vy += (cy - nd.y) * 0.01 * alpha;
  });

  // Collision
  for (let i = 0; i < n; i++) {
    const a = nodes[i];
    const ra = getCollisionRadius(a);
    for (let j = i + 1; j < n; j++) {
      const b = nodes[j];
      const rb = getCollisionRadius(b);
      let dx = b.x - a.x, dy = b.y - a.y;
      let dist = Math.sqrt(dx * dx + dy * dy) || 1;
      const minDist = ra + rb;
      if (dist < minDist) {
        const force = (minDist - dist) / dist * 0.5;
        const fx = dx * force, fy = dy * force;
        a.vx -= fx; a.vy -= fy;
        b.vx += fx; b.vy += fy;
      }
    }
  }

  // Integrate velocity → position
  nodes.forEach(nd => {
    if (nd.fx != null) { nd.x = nd.fx; nd.vx = 0; }
    else { nd.vx *= velocityDecay; nd.x += nd.vx; }
    if (nd.fy != null) { nd.y = nd.fy; nd.vy = 0; }
    else { nd.vy *= velocityDecay; nd.y += nd.vy; }
  });
}

// ── Rendering ──
let renderedLinks = [];
let renderedLabels = [];
let renderedNodes = [];

function activeNodes() {
  return graphData.nodes.filter(n => {
    if (n.type === 'source') return showSources;
    return visibleGroups.has(n.group);
  });
}

function activeEdges() {
  const ids = new Set(activeNodes().map(n => n.id));
  return graphData.edges.filter(e => ids.has(e._sid) && ids.has(e._tid));
}

function render() {
  const nodes = activeNodes();
  const edges = activeEdges();

  // Clear
  gLinks.innerHTML = '';
  gLabels.innerHTML = '';
  gNodes.innerHTML = '';
  renderedLinks = [];
  renderedLabels = [];
  renderedNodes = [];

  // Links
  edges.forEach(e => {
    const line = document.createElementNS(ns, 'line');
    line.setAttribute('stroke', e.type === 'sources' ? '#555' : '#444');
    line.setAttribute('stroke-width', e.type === 'contains' ? '1.2' : '0.8');
    line.setAttribute('stroke-opacity', '0.3');
    if (e.type === 'sources') line.setAttribute('stroke-dasharray', '4 2');
    line._edge = e;
    gLinks.appendChild(line);
    renderedLinks.push(line);
  });

  // Edge labels
  edges.forEach(e => {
    const text = document.createElementNS(ns, 'text');
    text.textContent = e.type;
    text.setAttribute('font-size', '8');
    text.setAttribute('fill', '#555');
    text.style.pointerEvents = 'none';
    text.style.display = showEdgeLabels ? 'block' : 'none';
    text._edge = e;
    gLabels.appendChild(text);
    renderedLabels.push(text);
  });

  // Nodes
  nodes.forEach(n => {
    const g = document.createElementNS(ns, 'g');
    g.setAttribute('class', 'node ' + n.type);
    g.style.cursor = 'pointer';

    const circle = document.createElementNS(ns, 'circle');
    const r = getRadius(n);
    const col = getColor(n);
    circle.setAttribute('r', r);
    circle.setAttribute('fill', col);
    circle.setAttribute('stroke', colorDarker(col, 0.3));
    circle.setAttribute('stroke-width', '1.5');
    g.appendChild(circle);

    const label = document.createElementNS(ns, 'text');
    label.textContent = n.label;
    label.setAttribute('dx', r + 4);
    label.setAttribute('dy', 4);
    label.setAttribute('font-size', n.type === 'domain' ? '12' : n.type === 'source' ? '9' : '10');
    label.setAttribute('fill', n.type === 'domain' ? '#bbb' : n.type === 'source' ? '#666' : '#888');
    label.setAttribute('font-weight', n.type === 'domain' ? '600' : '400');
    label.style.pointerEvents = 'none';
    g.appendChild(label);

    g._node = n;
    g._circle = circle;
    g._label = label;

    // Click
    g.addEventListener('click', (ev) => { ev.stopPropagation(); selectNode(n); });

    // Drag
    g.addEventListener('mousedown', (ev) => {
      if (ev.button !== 0) return;
      ev.stopPropagation();
      dragTarget = n;
      const pt = svgPoint(ev);
      dragOffsetX = pt.x - n.x;
      dragOffsetY = pt.y - n.y;
      n.fx = n.x; n.fy = n.y;
      reheat(0.3);
    });

    gNodes.appendChild(g);
    renderedNodes.push(g);
  });

  reheat(1);
}

function updatePositions() {
  const nodeIndex = {};
  activeNodes().forEach(n => { nodeIndex[n.id] = n; });

  renderedLinks.forEach(line => {
    const e = line._edge;
    const s = nodeIndex[e._sid], t = nodeIndex[e._tid];
    if (!s || !t) return;
    line.setAttribute('x1', s.x); line.setAttribute('y1', s.y);
    line.setAttribute('x2', t.x); line.setAttribute('y2', t.y);
  });

  renderedLabels.forEach(text => {
    const e = text._edge;
    const s = nodeIndex[e._sid], t = nodeIndex[e._tid];
    if (!s || !t) return;
    text.setAttribute('x', (s.x + t.x) / 2);
    text.setAttribute('y', (s.y + t.y) / 2);
  });

  renderedNodes.forEach(g => {
    const n = g._node;
    g.setAttribute('transform', 'translate(' + n.x + ',' + n.y + ')');
  });
}

function applyTransform() {
  gRoot.setAttribute('transform', 'translate(' + transform.x + ',' + transform.y + ') scale(' + transform.k + ')');
}

// ── Animation Loop ──
function reheat(a) {
  alpha = a || 1;
  if (!animating) { animating = true; tick(); }
}

function tick() {
  if (alpha < alphaMin) { animating = false; return; }
  alpha += (alphaMin - alpha) * alphaDecay;
  tickForces(activeNodes(), activeEdges());
  updatePositions();
  requestAnimationFrame(tick);
}

// ── SVG Coordinate Helpers ──
function svgPoint(ev) {
  const rect = svg.getBoundingClientRect();
  return {
    x: (ev.clientX - rect.left - transform.x) / transform.k,
    y: (ev.clientY - rect.top - transform.y) / transform.k
  };
}

// ── Mouse/Touch Events for Pan and Zoom ──
svg.addEventListener('mousedown', (ev) => {
  if (ev.button !== 0 || dragTarget) return;
  isPanning = true;
  panStartX = ev.clientX; panStartY = ev.clientY;
  panStartTX = transform.x; panStartTY = transform.y;
  svg.style.cursor = 'grabbing';
});

window.addEventListener('mousemove', (ev) => {
  if (dragTarget) {
    const pt = svgPoint(ev);
    dragTarget.fx = pt.x - dragOffsetX;
    dragTarget.fy = pt.y - dragOffsetY;
    reheat(0.3);
    return;
  }
  if (isPanning) {
    transform.x = panStartTX + (ev.clientX - panStartX);
    transform.y = panStartTY + (ev.clientY - panStartY);
    applyTransform();
  }
});

window.addEventListener('mouseup', () => {
  if (dragTarget) {
    dragTarget.fx = null; dragTarget.fy = null;
    dragTarget = null;
    reheat(0.1);
  }
  isPanning = false;
  svg.style.cursor = '';
});

svg.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
  const delta = ev.deltaY > 0 ? 0.9 : 1.1;
  const newK = Math.min(8, Math.max(0.1, transform.k * delta));
  const ratio = newK / transform.k;
  transform.x = mx - (mx - transform.x) * ratio;
  transform.y = my - (my - transform.y) * ratio;
  transform.k = newK;
  applyTransform();
}, { passive: false });

// Click on background to deselect
svg.addEventListener('click', (ev) => {
  if (ev.target === svg) closeDetail();
});

// ── Resolve edge source/target to IDs ──
graphData.edges.forEach(e => {
  e._sid = typeof e.source === 'object' ? e.source.id : e.source;
  e._tid = typeof e.target === 'object' ? e.target.id : e.target;
});

// ── Interaction Functions ──
function selectNode(d) {
  selectedNode = d;
  const edges = graphData.edges;
  const connected = new Set();
  const connList = [];
  edges.forEach(e => {
    if (e._sid === d.id) { connected.add(e._tid); connList.push({id: e._tid, type: e.type, dir: 'out'}); }
    if (e._tid === d.id) { connected.add(e._sid); connList.push({id: e._sid, type: e.type, dir: 'in'}); }
  });
  connected.add(d.id);

  // Highlight/dim nodes
  renderedNodes.forEach(g => {
    const n = g._node;
    const isConn = connected.has(n.id);
    const isSel = n.id === d.id;
    g._circle.setAttribute('stroke-width', isSel ? '3' : '1.5');
    g._circle.setAttribute('opacity', isConn ? '1' : '0.15');
    g._label.setAttribute('opacity', isConn ? '1' : '0.1');
  });

  // Highlight/dim links
  renderedLinks.forEach(line => {
    const e = line._edge;
    const isConn = e._sid === d.id || e._tid === d.id;
    line.setAttribute('stroke-opacity', isConn ? '0.9' : '0.03');
    line.setAttribute('stroke-width', isConn ? '2' : (e.type === 'contains' ? '1.2' : '0.8'));
  });

  // Detail panel
  document.getElementById('detail-title').textContent = d.label;
  const badge = document.getElementById('detail-type');
  badge.textContent = d.type.toUpperCase() + ' [' + d.id + ']';
  badge.style.background = getColor(d) + '33';
  badge.style.color = getColor(d);
  document.getElementById('detail-info').textContent = d.type === 'domain' ? 'Group ' + d.group : 'Domain group ' + d.group;

  const connHTML = connList.map(c => {
    const n = nodeMap[c.id];
    const arrow = c.dir === 'out' ? '→' : '←';
    return '<div class="conn-item" data-nid="' + c.id + '">' + arrow + ' <span style="color:' + (n ? getColor(n) : '#888') + '">' + c.type + '</span> ' + (n ? n.label : c.id) + '</div>';
  }).join('');
  const connEl = document.getElementById('detail-connections');
  connEl.innerHTML = '<strong>Connections (' + connList.length + '):</strong>' + connHTML;

  // Make connection items clickable
  connEl.querySelectorAll('.conn-item').forEach(el => {
    el.addEventListener('click', () => {
      const target = nodeMap[el.dataset.nid];
      if (target) selectNode(target);
    });
  });

  document.getElementById('detail').style.display = 'block';
}

function closeDetail() {
  selectedNode = null;
  document.getElementById('detail').style.display = 'none';
  renderedNodes.forEach(g => {
    g._circle.setAttribute('stroke-width', '1.5');
    g._circle.setAttribute('opacity', '1');
    g._label.setAttribute('opacity', '1');
  });
  renderedLinks.forEach(line => {
    line.setAttribute('stroke-opacity', '0.3');
    line.setAttribute('stroke-width', line._edge.type === 'contains' ? '1.2' : '0.8');
  });
}

function resetView() {
  transform = { x: 0, y: 0, k: 1 };
  applyTransform();
  closeDetail();
  allGroupIds.forEach(g => visibleGroups.add(g));
  showSources = false;
  clustered = false;
  graphData.nodes.forEach(n => { n.fx = null; n.fy = null; });
  updateLegendUI();
  render();
}

function toggleLabels() {
  showEdgeLabels = !showEdgeLabels;
  renderedLabels.forEach(text => {
    text.style.display = showEdgeLabels ? 'block' : 'none';
  });
  reheat(0.8);
}

function toggleSearch() {
  const s = document.getElementById('search');
  s.style.display = s.style.display === 'none' ? 'block' : 'none';
  if (s.style.display === 'block') document.getElementById('search-input').focus();
}

function searchNodes(q) {
  if (!q) {
    renderedNodes.forEach(g => { g._circle.setAttribute('opacity', '1'); g._label.setAttribute('opacity', '1'); });
    renderedLinks.forEach(line => { line.setAttribute('stroke-opacity', '0.3'); });
    return;
  }
  q = q.toLowerCase();
  const matches = new Set();
  graphData.nodes.forEach(n => {
    if (n.label.toLowerCase().includes(q) || n.id.toLowerCase().includes(q)) matches.add(n.id);
  });
  renderedNodes.forEach(g => {
    const match = matches.has(g._node.id);
    g._circle.setAttribute('opacity', match ? '1' : '0.15');
    g._label.setAttribute('opacity', match ? '1' : '0.1');
  });
  renderedLinks.forEach(line => { line.setAttribute('stroke-opacity', '0.03'); });
}

function toggleSources() {
  showSources = !showSources;
  render();
}

function filterPredictions() {
  const predIds = new Set();
  graphData.nodes.forEach(n => { if (n.type === 'prediction' || n.id === 'D_PRED') predIds.add(n.id); });
  graphData.edges.forEach(e => {
    if (predIds.has(e._sid)) predIds.add(e._tid);
    if (predIds.has(e._tid)) predIds.add(e._sid);
  });
  renderedNodes.forEach(g => {
    const match = predIds.has(g._node.id);
    g._circle.setAttribute('opacity', match ? '1' : '0.15');
    g._label.setAttribute('opacity', match ? '1' : '0.1');
  });
  renderedLinks.forEach(line => {
    const e = line._edge;
    const match = predIds.has(e._sid) && predIds.has(e._tid);
    line.setAttribute('stroke-opacity', match ? '0.3' : '0.03');
  });
}

function groupByDomain() {
  clustered = !clustered;
  const w = window.innerWidth, h = window.innerHeight;
  const domainNodes = graphData.nodes.filter(n => n.type === 'domain');
  const domainCount = domainNodes.length || 1;
  if (clustered) {
    domainNodes.forEach((d, i) => {
      const angle = (i / domainCount) * 2 * Math.PI;
      d.fx = w/2 + Math.cos(angle) * 280;
      d.fy = h/2 + Math.sin(angle) * 280;
    });
  } else {
    graphData.nodes.forEach(d => { d.fx = null; d.fy = null; });
  }
  reheat(1);
}

// ── Legend ──
function toggleDomain(group) {
  if (visibleGroups.has(group)) visibleGroups.delete(group);
  else visibleGroups.add(group);
  updateLegendUI();
  render();
}

function toggleAllDomains() {
  const allOn = visibleGroups.size === allGroupIds.size;
  if (allOn) visibleGroups.clear();
  else allGroupIds.forEach(g => visibleGroups.add(g));
  updateLegendUI();
  render();
}

function updateLegendUI() {
  document.querySelectorAll('#legend .item[data-group]').forEach(el => {
    const g = parseInt(el.dataset.group);
    el.classList.toggle('off', !visibleGroups.has(g));
  });
  const allOn = visibleGroups.size === allGroupIds.size;
  const toggleEl = document.getElementById('legend-toggle-all');
  if (toggleEl) toggleEl.textContent = allOn ? 'deselect all' : 'select all';
}

// ── Stats & Init ──
function init() {
  if (graphData.nodes.length === 0) {
    document.getElementById('empty-state').style.display = 'block';
    document.getElementById('stats').textContent = 'Empty. Ingest material to populate.';
    return;
  }

  initPositions();

  const domainCount = graphData.nodes.filter(n => n.type === 'domain').length;
  const conceptCount = graphData.nodes.filter(n => n.type === 'concept').length;
  const meta = graphData.meta || {};
  document.getElementById('stats').textContent =
    domainCount + ' domains · ' + conceptCount + ' concepts · ' + graphData.edges.length + ' edges' +
    (meta.updated ? ' · Updated ' + meta.updated : '');

  render();
}

init();
</script>
